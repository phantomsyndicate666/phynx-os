# phynx, made with the linuxlive.com wizard on 2026-11-11.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "phynx"
version: "0.1"
base: fedora
desktop: kde
apps:
  - firefox
  - libreoffice
  - vlc
  - krita
  - gimp
  - blender
  - gcompris
  - tuxpaint
  - vscode
  - chromium
  - obs-studio
  - steam
  - heroic
  - discord
flathub:
  - org.torproject.torbrowser-launcher
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#761fe0"
settings:
  hostname: phynx
  autologin: true
  dock:
    - discord
    - org.torproject.torbrowser-launcher
firefox:
  homepage: "https://phynx.netlify.app"
